plugins {
    alias(libs.plugins.android.application)
    id 'io.dcloud.uts.kotlin'
    id 'io.dcloud.uts.auto-register'
}

def app = new groovy.json.JsonSlurper().parse(file('app-build.json'))

android {
    namespace 'top.aiolife.mobile.localtest'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'top.aiolife.mobile.localtest'
        minSdk 23
        targetSdk 36
        ndk { abiFilters 'arm64-v8a' }
        versionCode app.version.code
        versionName app.version.name
        manifestPlaceholders = [aioAppId: app.id]
    }
    if (app.debugKeystore) {
        signingConfigs.debug.storeFile = file(app.debugKeystore)
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        noCompress 'uni-app-x-framework-vapor', 'uni-app-x-framework-vapor-dev', 'js', 'bytes'
        ignoreAssetsPattern '!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~'
    }
    packagingOptions {
        pickFirst 'lib/*/libstlport_shared.so'
        pickFirst 'lib/*/libc++_shared.so'
        jniLibs { useLegacyPackaging false }
    }
}

dependencies {
    implementation files(app.archives)
    app.dependencies.each { implementation it }
    implementation 'androidx.tracing:tracing-ktx:1.3.0'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:2.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.facebook.fresco:fresco:3.4.0'
    implementation 'com.facebook.fresco:animated-base:3.4.0'
    implementation 'com.facebook.fresco:animated-gif:3.4.0'
    implementation 'com.facebook.fresco:animated-webp:3.4.0'
    implementation 'com.facebook.fresco:webpsupport:3.4.0'
    implementation 'com.facebook.fresco:imagepipeline:3.4.0'
    implementation 'com.facebook.fresco:drawee:3.4.0'
    implementation 'com.facebook.fresco:middleware:3.4.0'
    implementation 'com.alibaba:fastjson:1.2.83'
    implementation 'com.github.getActivity:XXPermissions:18.63'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    implementation 'com.squareup.okhttp3:okhttp:3.12.12'
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'
    implementation 'androidx.webkit:webkit:1.6.0'
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    implementation 'com.github.albfernandez:juniversalchardet:2.0.4'
    implementation 'com.tencent.map:tencent-map-vector-sdk:5.6.0'
    implementation 'com.tencent.map:sdk-utilities:1.0.9'
    implementation 'com.tencent.map.geolocation:TencentLocationSdk-openplatform:7.5.4.3'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}

def registrar = layout.buildDirectory.file('generated/utsAutoRegister/debug/java/io/dcloud/uts/generated/StaticUTSAutoRegister.java')
tasks.matching { it.name == 'generateDebugUTSAutoRegister' }.configureEach {
    inputs.property('aioPluginPackages', app.pluginPackages)
    inputs.property('aioSdkRegistrars', app.sdkRegistrars)
    doLast {
        def file = registrar.get().asFile
        def source = file.getText('UTF-8')
        def missing = app.sdkRegistrars.findAll {
            !source.contains(it + '.INSTANCE.registerMethods()') || !source.contains(it + '.INSTANCE.registerComponents()')
        }
        if (missing) throw new GradleException("SDK 原生模块未注册 ${missing.join(', ')}")
        def entry = '    public static void registerAll() {'
        if (!source.contains(entry)) throw new GradleException('SDK 自动注册入口已变化')
        def calls = app.pluginPackages.collect { "        ${it}.UniUTSMethodRegister.Companion.registerUTSMethod();" }
        if (calls && !source.contains(calls.join('\n'))) {
            file.setText(source.replace(entry, entry + '\n' + calls.join('\n')), 'UTF-8')
        }
    }
}
